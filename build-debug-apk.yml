name: Build TOOFAN V2RAY debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-client/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-client
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://your-domain.example/api/v1' }}
        run: gradle --no-daemon assembleDebug -PAPI_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: toofan-v2ray-debug-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
